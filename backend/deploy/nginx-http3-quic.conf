# Nginx 1.25+ HTTP/3 (QUIC) + HTTP/2 Configuration for api.serv5.com.eg
# Requires Nginx >= 1.25.0 built with --with-http_v3_module and UDP port 443 open in firewall.

server {
    listen 80;
    listen [::]:80;
    server_name api.serv5.com.eg;
    return 301 https://$host$request_uri;
}

server {
    # HTTP/3 over QUIC (UDP 443)
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;

    # HTTP/2 & HTTP/1.1 fallback over TCP 443
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;
    http3 on;
    quic_retry on;
    ssl_early_data on;

    server_name api.serv5.com.eg;
    root /var/www/serv5/backend/public;
    index index.php;

    # TLS 1.3 is required for HTTP/3 (QUIC)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/api.serv5.com.eg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.serv5.com.eg/privkey.pem;

    # Advertise HTTP/3 (h3) and HTTP/2 (h2) on all responses
    add_header Alt-Svc 'h3=":443"; ma=86400, h3-29=":443"; ma=86400, h2=":443"; ma=86400' always;

    charset utf-8;
    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param EARLY_DATA $ssl_early_data;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
