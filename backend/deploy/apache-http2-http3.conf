# Apache VirtualHost Configuration with HTTP/2 + HTTP/3 Alt-Svc Advertisement
# Enable required modules:
#   sudo a2enmod http2 headers ssl proxy_fcgi setenvif
#   sudo systemctl restart apache2

<IfModule mod_http2.c>
    Protocols h2 h2c http/1.1
    H2Direct on
    H2ModernTLSOnly on
    H2Upgrade on
</IfModule>

<IfModule mod_headers.c>
    Header setifempty Alt-Svc "h3=\":443\"; ma=86400, h3-29=\":443\"; ma=86400, h2=\":443\"; ma=86400"
</IfModule>
