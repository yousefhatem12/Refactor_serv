# cPanel Deployment Configuration File
# ----------------------------------------------------
# This file automates copying and deploying files from your Git repo
# to their respective live paths on cPanel when you trigger a deploy.
#
# IMPORTANT: Adjust "serv5eg" to your actual cPanel username if it is different.
# Also verify the backend and frontend target directories on your server.

deployment:
  tasks:
    # 1. Define paths
    - export FRONTEND_PATH=/home/serv5eg/serv5-frontend2026
    - export BACKEND_PATH=/home/serv5eg/api.serv5.com.eg

    # 2. Deploy Frontend (Next.js)
    # Copies all files except backend, git config, and dev files
    - /bin/rsync -av --delete --exclude="backend" --exclude=".git" --exclude="node_modules" --exclude="deleted-backend" * $FRONTEND_PATH/

    # 3. Deploy Backend (Laravel)
    # Copies everything inside backend/ to the API directory
    - /bin/rsync -av --delete backend/ $BACKEND_PATH/

    # 4. Post-Deployment Backend Tasks (Laravel migrations & cache clearing)
    - cd $BACKEND_PATH && php artisan migrate --force
    - cd $BACKEND_PATH && php artisan config:cache
    - cd $BACKEND_PATH && php artisan route:cache
    - cd $BACKEND_PATH && php artisan view:cache
