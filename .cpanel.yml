# cPanel Deployment Configuration File
# ----------------------------------------------------
# This file automates copying and deploying files from your Git repo
# to their respective live paths on cPanel when you trigger a deploy.

deployment:
  tasks:
    # 1. Deploy Frontend (Next.js)
    # Copies all files except backend, git config, and dev files to the live folder
    - mkdir -p /home2/serv5eg/public_html/serv5-frontend2026
    - tar --exclude="backend" --exclude=".git" --exclude="node_modules" --exclude="deleted-backend" --exclude=".env.local" --exclude=".env.development" --exclude=".env.development.local" --exclude=".env.test.local" --exclude=".env.production.local" -cf - . | (cd /home2/serv5eg/public_html/serv5-frontend2026/ && tar -xf -)

    # 2. Install Frontend Dependencies & Build
    # Each task runs in its own subshell — set nodevenv PATH inline.
    # The nodevenv for this app is at: /home2/serv5eg/nodevenv/public_html/serv5-frontend2026/20/
    - export PATH=/home2/serv5eg/nodevenv/public_html/serv5-frontend2026/20/bin:$PATH && cd /home2/serv5eg/public_html/serv5-frontend2026 && npm install --production=false
    # Remove any local dev env file that may have been deployed accidentally
    - rm -f /home2/serv5eg/public_html/serv5-frontend2026/.env.local
    # prebuild script in package.json converts node_modules symlink → hard links (fixes Turbopack)
    - export PATH=/home2/serv5eg/nodevenv/public_html/serv5-frontend2026/20/bin:$PATH && cd /home2/serv5eg/public_html/serv5-frontend2026 && npm run build

    # 3. Deploy Backend (Laravel)
    # Copies everything inside backend/ to the live API folder.
    # NOTE: .env is excluded — the production .env must already exist on the server
    # and is never overwritten by deployments.
    - mkdir -p /home2/serv5eg/public_html/serv5-backend2026
    - tar -C backend/ --exclude='./.env' -cf - . | (cd /home2/serv5eg/public_html/serv5-backend2026/ && tar -xf -)

    # 4. Post-Deployment Backend Tasks
    - cd /home2/serv5eg/public_html/serv5-backend2026 && php artisan migrate --force
    - cd /home2/serv5eg/public_html/serv5-backend2026 && php artisan optimize:clear
    - cd /home2/serv5eg/public_html/serv5-backend2026 && php artisan storage:link --force
    - cd /home2/serv5eg/public_html/serv5-backend2026 && php artisan config:cache
    - cd /home2/serv5eg/public_html/serv5-backend2026 && php artisan route:cache
    - cd /home2/serv5eg/public_html/serv5-backend2026 && php artisan view:cache

    # 5. Reload Frontend (Passenger Node.js Server restart)
    - mkdir -p /home2/serv5eg/public_html/serv5-frontend2026/tmp && touch /home2/serv5eg/public_html/serv5-frontend2026/tmp/restart.txt
